# Upstreams xymbols follows: Lucide (geometry), lucide-animated (animations,
# with the Motion version the spring tests compare against) and UNA (its
# animated icon specs, a submodule at upstream/una). The Lucide packages move
# together (the compat tests check one version across all five). An update
# that breaks nothing merges and releases itself: see upstream.yml and
# release-upstream.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    groups:
      lucide:
        patterns:
          - lucide
          - lucide-static
          - lucide-react
          - lucide-react-native
          - "@lucide/vue"
      animations:
        patterns:
          - lucide-animated
          - motion-dom
      tooling:
        patterns:
          - "*"
        exclude-patterns:
          - lucide
          - lucide-static
          - lucide-react
          - lucide-react-native
          - "@lucide/vue"
          - lucide-animated
          - motion-dom
    commit-message:
      prefix: deps

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
